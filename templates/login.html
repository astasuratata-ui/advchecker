<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MeowTool</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        h1 { color: #58a6ff; text-align: center; margin-bottom: 10px; }
        .subtitle { color: #8b949e; text-align: center; margin-bottom: 30px; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            margin-bottom: 15px;
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #58a6ff; }
        button {
            width: 100%;
            padding: 12px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        button:hover { background: #2ea043; }
        .error { color: #f85149; text-align: center; margin-bottom: 15px; font-size: 14px; }
        .footer { text-align: center; margin-top: 20px; color: #484f58; font-size: 12px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🐱 MeowTool</h1>
        <p class="subtitle">Replit Edition</p>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="Password" required autofocus>
            <button type="submit">Login</button>
        </form>
        <p class="footer">Default: meow123 (ganti di Secrets)</p>
    </div>
</body>
</html>
